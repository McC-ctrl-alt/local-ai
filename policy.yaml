# Department names are the folder names under knowledge_test/.
# Each role has one named rule. Python enforces the department list.
roles:
  hr_partner:
    departments: [hr]
    rule:
      id: HR-01
      text: HR documents may be read only by the hr_partner and the managing_partner.
  legal_counsel:
    departments: [legal]
    rule:
      id: LEG-01
      text: Legal documents may be read only by the legal_counsel and the managing_partner.
  tax_analyst:
    departments: [tax]
    rule:
      id: TAX-01
      text: Tax documents may be read only by the tax_analyst and the managing_partner.
  managing_partner:
    departments: [hr, legal, tax]
    rule:
      id: MP-01
      text: The managing_partner may read HR, Legal, and Tax documents.
